[install]
# Bun's default "isolated" linker does NOT hoist, and this app cannot survive
# that. `@oxy.so/app-preset/css/base.css` reaches its `@source` globs by RELATIVE
# path — "../../services/lib", "../../bloom/lib" — which resolve only when
# app-preset, services and bloom are real siblings under ONE node_modules/@oxy.so/.
# Under the isolated linker those globs match nothing: Tailwind still emits a
# stylesheet, the SDK's and Bloom's class names are simply absent from it, and
# every className layout utility in @oxy.so/services' web screens is inert —
# react-native-web's base View reset shows through (flex-direction:column,
# padding:0) with no error anywhere. `createOxyMetroConfig`'s nodeModulesPaths
# ([projectRoot/node_modules, repoRoot/node_modules]) assumes the same layout.
linker = "hoisted"

# NOTE: `peer = false` is deliberately NOT set here, though OxyHQServices sets it
# at its root. In the monorepo two REQUIRED peers reach this app only because
# some OTHER workspace package declares them —
# @react-native-community/netinfo + react-native-qrcode-svg (@oxy.so/services,
# neither in peerDependenciesMeta, so both are hard requirements; expo-symbols
# was a third until Bloom 15 dropped it). This repo has
# no other package. Both are now declared explicitly in
# packages/frontend/package.json as well; letting bun install peers is the belt
# to that braces.

# Supply-chain quarantine: refuse to RESOLVE anything published in the last week.
# Resolution-only, so an already-locked fresh package installs fine. A step that
# deliberately RE-RESOLVES (the CI lockfile-drift gate) must pass
# `--minimum-release-age=0` or it goes red on any recently-published dependency.
#
# First-party packages are exempt: the quarantine guards against a freshly
# compromised THIRD-PARTY release, and publishing an Oxy package then bumping
# its consumer in the same session is the normal workflow. Bun matches
# `minimumReleaseAgeExcludes` by EXACT name (a scope glob such as "@oxy.so/*"
# is accepted and silently matches nothing), so the list names every published
# first-party package: the same list in every Oxy repo with the quarantine.
# `scripts/check-release-age-excludes.mjs` (run in CI) fails if bun.lock
# resolves a first-party package the list misses, or if the list names a glob
# or anything outside the first-party scopes. A newly published first-party
# package is added here in each of those repos.
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "@alia-codea/cli",
  "@alia.onl/sdk",
  "@alia.onl/server",
  "@clarity.surf/sdk",
  "@crowdsource.you/contracts",
  "@crowdsource.you/core",
  "@fairco.in/core",
  "@fairco.in/rpc-client",
  "@gemies/sdk",
  "@gemies/server",
  "@goway.to/maps",
  "@goway.to/sdk",
  "@kaana.ai/contracts",
  "@kaana.ai/sdk",
  "@mercaria.co/sdk",
  "@oxy.so/allo-contracts",
  "@oxy.so/allo-sdk",
  "@oxy.so/app-preset",
  "@oxy.so/bloom",
  "@oxy.so/bloom-ai-icons",
  "@oxy.so/bloom-avatar-native",
  "@oxy.so/bloom-data",
  "@oxy.so/bloom-editor",
  "@oxy.so/bloom-language",
  "@oxy.so/bloom-language-codemod",
  "@oxy.so/bloom-language-compiler",
  "@oxy.so/bloom-language-compiler-darwin-arm64",
  "@oxy.so/bloom-language-compiler-darwin-x64",
  "@oxy.so/bloom-language-compiler-linux-arm64-gnu",
  "@oxy.so/bloom-language-compiler-linux-x64-gnu",
  "@oxy.so/bloom-language-compiler-wasm32-wasi",
  "@oxy.so/bloom-language-compiler-win32-x64-msvc",
  "@oxy.so/bloom-lens",
