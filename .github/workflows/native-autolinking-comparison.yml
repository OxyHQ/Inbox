name: Compare native autolinking

on:
  pull_request:
    paths:
      - package.json
      - packages/frontend/package.json
      - bun.lock
      - .github/workflows/native-autolinking-comparison.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install both frozen graphs
        run: |
          (cd baseline && bun install --frozen-lockfile)
          (cd candidate && bun install --frozen-lockfile)
      - name: Compare Expo selections on Android and Apple
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { realpathSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { dirname, join, relative, resolve } from 'node:path';

          function inspect(repository, platform) {
            const repo = resolve(repository);
            const root = join(repo, 'packages/frontend');
            const fromApp = createRequire(join(root, 'package.json'));
            const cli = join(dirname(fromApp.resolve('expo-modules-autolinking/package.json')), 'bin/expo-modules-autolinking.js');
            const result = JSON.parse(execFileSync(process.execPath, [cli, 'resolve', '--platform', platform, '--project-root', root, '--json'], { encoding: 'utf8' }));
            if (!Array.isArray(result.modules)) throw new Error('Invalid Expo resolver result');
            const source = path => relative(repo, realpathSync(path));
            return Object.fromEntries(['@oxy.so/services', 'expo-crypto'].map(name => [name,
              result.modules.filter(item => item.packageName === name).map(item => ({
                version: item.packageVersion,
                projects: item.projects?.map(project => ({ name: project.name, source: source(project.sourceDir), modules: project.modules })),
                pods: item.pods?.map(pod => ({ name: pod.podName, source: source(pod.podspecDir) })),
                modules: item.modules,
                swiftModuleNames: item.swiftModuleNames,
              }))
            ]));
          }
          for (const platform of ['android', 'apple']) {
            const before = inspect('baseline', platform);
            const after = inspect('candidate', platform);
            for (const name of ['@oxy.so/services', 'expo-crypto']) {
              if (after[name].length !== 1) throw new Error(`Candidate must select ${name} exactly once on ${platform}`);
            }
            console.log(JSON.stringify({ platform, before, after }, null, 2));
          }
          NODE
