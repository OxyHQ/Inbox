name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main (or any non-PR event) gets a group of its own through the run id, since a
# shared group would still let a newer pending run replace an older pending one
# even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # No build prelude. In OxyHQ/oxy this job first built @oxy.so/contracts,
      # protocol, core, services and expo-splash from workspace source; here all
      # five arrive prebuilt from npm. That is the whole simplification of the
      # split.
      - run: bun install

      # `--frozen-lockfile` is deliberately NOT used, here or in the deploy. On
      # bun 1.3.14 it exits 0 on both desync shapes that actually ship (a
      # workspace version bump, and a widened-but-satisfiable range) AND
      # false-positives on non-deterministic configVersion churn — a flag that
      # misses what it exists to catch and fails correct builds. This asks the
      # same question without bun's judgement in the middle.
      #
      # `--minimum-release-age=0`: this step RE-RESOLVES by design, and on a
      # cold manifest cache the bunfig quarantine judges every dependency
      # afresh, including already-locked ones.
      - name: bun.lock is in sync with the manifests
        run: |
          bun install --minimum-release-age=0
          git diff --exit-code bun.lock || {
            echo "::error::bun.lock does not match the package.json files. Run 'bun install' and commit bun.lock."
            exit 1
          }

      - name: Verify Oxy dependency health
        run: bun run doctor:oxy

      # Biome owns formatting and almost all linting (root biome.json). `ci`
      # never writes; it fails on unformatted files and on error-level rules.
      - name: Biome (format + lint)
        run: bunx biome ci .

      # The minimal Expo ESLint (packages/frontend/eslint.config.js) keeps only
      # what Biome cannot check: eslint-plugin-expo's EXPO_PUBLIC_* inlining
      # guards and the React Compiler rules. `expo lint` exits non-zero on any
      # error. This replaces the old `lint (ratchet)` job: its error count had
      # reached 0 on main (run 38067374320), the point at which that job's own
      # note said to delete it and make lint pass/fail here.
      - name: Expo ESLint
        run: bun run --cwd packages/frontend lint

      - run: bun run typecheck

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever, and it grows by accretion — one reasonable paragraph
      # at a time, invisible per-commit. Nothing breaks when it grows, which is
      # why a gate rather than a convention. Reads the tracked file listing only.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md
      - run: bun run test

      # `bun test` must be REFUSED, not half-run. Asserted rather than assumed:
      # a preload that silently stopped loading would leave the suite reporting
      # a plausible smaller number under the wrong runner, which is the entire
      # hazard the guard exists for.
      #
      # The pattern is the guard's own sentence, NOT "bun test" — that substring
      # appears in bun's `bun test v1.3.x` banner, so grepping for it would pass
      # identically whether or not the guard ever loaded. Exit code alone is no
      # better: a half-run suite also exits non-zero.
      - name: '`bun test` is refused at both entry points'
        run: |
          # `set +e` is REQUIRED, not tidiness: GitHub runs this with
          # `bash -e {0}`, so the failing command substitution below aborts the
          # shell before `code=$?` is ever read — the step dies having printed
          # nothing at all, which is what it did on the first run.
          set +e
          set -uo pipefail
          for dir in . packages/frontend; do
            out=$(cd "$dir" && bun test 2>&1); code=$?
            echo "--- $dir → exit $code"
            if [ "$code" -eq 0 ]; then
              echo "::error::bun test succeeded in $dir; the refuse-bun-test preload is not wired."
              exit 1
            fi
            printf '%s' "$out" | grep -qF 'does not support `bun test`' || {
              echo "::error::bun test failed in $dir, but not via the guard — it half-ran the suite:"
              printf '%s' "$out" | head -10
              exit 1
            }
          done
