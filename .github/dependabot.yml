version: 2

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # One group for EVERY update, majors included: one PR per week.
    groups:
      all:
        patterns:
          - "*"
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-web"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/netinfo"
      - dependency-name: "@react-native-menu/menu"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-keyboard-controller"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-webview"
      - dependency-name: "react-native-worklets"
      - dependency-name: "nativewind"
      - dependency-name: "tailwindcss"
      # zod 4: the email schemas extend @oxy.so/contracts', which are zod 3; a
      # major here is 563 type errors until contracts moves. TypeScript 7:
      # typescript-eslint does not support it yet, so lint cannot run (#60).
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    groups:
      all:
        patterns:
          - "*"
