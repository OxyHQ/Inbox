name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main (or any non-PR event) gets a group of its own through the run id, since a
# shared group would still let a newer pending run replace an older pending one
# even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true, on
  # same-repository pull_request and merge_group runs only. Push and dispatch
  # runs stay hosted: deploy.yml releases from a push run that concluded
  # `success`, and a race loser makes a run `cancelled`. Unset, `check` runs
  # hosted as before and none of these takes a runner. Set, `check` runs on
  # seldon-ci; if that lane is still queued 3 minutes after it was created its
  # hosted twin (`check-hosted`) queues, the lane that starts first wins and the
  # finish job cancels the other through its job-level concurrency group. A
  # Seldon lane that fails, whatever the reason (the house network drops new
  # connections in bursts), reruns hosted in `check-rescue`, which fails again
  # on a genuine failure. CI complete takes the result from the race.
  #
  # While the race is off, the idle twin and rescue report under another name,
  # so a skipped one can never stand in for the required
  # `typecheck · lint · test` check.
  race:
    if: ${{ !cancelled() && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read
    with:
      names: |
        typecheck · lint · test

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read
    with:
      names: |
        typecheck · lint · test

  check:
    name: typecheck · lint · test
    runs-on: &seldon-lane ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-typecheck · lint · test
    permissions: &race-lane-permissions
      contents: read
      actions: read # the Seldon race guard reads this run's jobs
    # A good run takes about a minute; the budget is for a cold runner and a
    # slow registry, not for a hang to hold one of the org's 20 job slots.
    timeout-minutes: 15
    # The first step is the Seldon race guard: a lane that starts after its
    # hosted twin waits there to be cancelled.
    steps: &check-steps
      - &race-guard
        name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Expo SDK 58's CLI supports Node 22.13+ / 24.3+ only (`expo lint` here,
      # `expo export` in the deploy). Pinned rather than trusting the runner
      # image's default Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No build prelude. In OxyHQ/oxy this job first built @oxy.so/contracts,
      # protocol, core, services and expo-splash from workspace source; here all
      # five arrive prebuilt from npm. That is the whole simplification of the
      # split.
      # --frozen-lockfile fails fast on the obvious desync. It is not the whole
      # check: on bun 1.3.14 it exited 0 on both desync shapes that actually
      # ship (a workspace version bump, and a widened-but-satisfiable range)
      # and false-positived on configVersion churn. On 1.4.3 the committed lock
      # installs frozen cleanly (measured 2026-10-15). The step below still
      # asks the full question without bun's judgement in the middle.
      - run: bun install --frozen-lockfile

      # `--minimum-release-age=0`: this step RE-RESOLVES by design, and on a
      # cold manifest cache the bunfig quarantine judges every dependency
      # afresh, including already-locked ones.
      - name: bun.lock is in sync with the manifests
        run: |
          bun install --minimum-release-age=0
          git diff --exit-code bun.lock || {
            echo "::error::bun.lock does not match the package.json files. Run 'bun install' and commit bun.lock."
            exit 1
          }

      # bunfig.toml exempts every first-party package from the install
      # quarantine by exact name (see scripts/check-release-age-excludes.mjs).
      - name: First-party packages are exempt from the install quarantine
        run: |
          node --test scripts/test-check-release-age-excludes.mjs
          node scripts/check-release-age-excludes.mjs

      - name: Verify Oxy dependency health
        run: bun run doctor:oxy

      - name: Verify Android device session module autolinking
        run: |
          node -e '
            const { createRequire } = require("node:module");
            const { resolve } = require("node:path");
            const semver = require("semver");
            const fromApp = createRequire(resolve("packages/frontend/package.json"));
            const declared = fromApp("./package.json").dependencies?.["@oxy.so/services"];
            const installed = fromApp("@oxy.so/services/package.json").version;
            if (typeof declared !== "string" || !semver.validRange(declared) ||
                !semver.valid(installed) || !semver.satisfies(installed, declared)) {
              console.error("Installed Oxy Services does not satisfy the app declaration");
              process.exit(1);
            }
          '
          bun run oxy-doctor-expo-android --project-root=packages/frontend \
            --require-source=SharedDeviceSessionPublish.kt \
            --require-source=SharedDeviceSessionSweep.kt \
            --require-source=OxyDeviceSessionStore.kt

      # Biome owns formatting and almost all linting (root biome.json). `ci`
      # never writes; it fails on unformatted files and on error-level rules.
      # The warning baseline was cleared to zero, and `--error-on-warnings`
      # keeps it there: a rule whose recommended level is `warn`
      # (noExplicitAny, noNonNullAssertion, ...) fails the build too, instead
      # of building up unseen.
      - name: Biome (format + lint)
        run: bunx biome ci --error-on-warnings .

      # The minimal Expo ESLint (packages/frontend/eslint.config.js) keeps only
      # what Biome cannot check: eslint-plugin-expo's EXPO_PUBLIC_* inlining
      # guards and the React Compiler rules. `expo lint` exits non-zero on any
      # error. This replaces the old `lint (ratchet)` job: its error count had
      # reached 0 on main (run 38067374320), the point at which that job's own
      # note said to delete it and make lint pass/fail here.
      - name: Expo ESLint
        run: bun run --cwd packages/frontend lint

      - run: bun run typecheck

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever, and it grows by accretion — one reasonable paragraph
      # at a time, invisible per-commit. Nothing breaks when it grows, which is
      # why a gate rather than a convention. Reads the tracked file listing only.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md
      - run: bun run test

      # `bun test` must be REFUSED, not half-run. Asserted rather than assumed:
      # a preload that silently stopped loading would leave the suite reporting
      # a plausible smaller number under the wrong runner, which is the entire
      # hazard the guard exists for.
      #
      # The pattern is the guard's own sentence, NOT "bun test" — that substring
      # appears in bun's `bun test v1.3.x` banner, so grepping for it would pass
      # identically whether or not the guard ever loaded. Exit code alone is no
      # better: a half-run suite also exits non-zero.
      - name: "`bun test` is refused at both entry points"
        run: |
          # `set +e` is REQUIRED, not tidiness: GitHub runs this with
          # `bash -e {0}`, so the failing command substitution below aborts the
          # shell before `code=$?` is ever read — the step dies having printed
          # nothing at all, which is what it did on the first run.
          set +e
          set -uo pipefail
          for dir in . packages/frontend; do
            out=$(cd "$dir" && bun test 2>&1); code=$?
            echo "--- $dir → exit $code"
            if [ "$code" -eq 0 ]; then
              echo "::error::bun test succeeded in $dir; the refuse-bun-test preload is not wired."
              exit 1
            fi
            printf '%s' "$out" | grep -qF 'does not support `bun test`' || {
              echo "::error::bun test failed in $dir, but not via the guard — it half-ran the suite:"
              printf '%s' "$out" | head -10
              exit 1
            }
          done

  # check's hosted twin in the Seldon race: the same name and steps.
  check-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'typecheck · lint · test' || 'typecheck · lint · test (Seldon race off)' }}
    needs: [race]
    if: ${{ !cancelled() && !failure() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-typecheck · lint · test
    permissions: *race-lane-permissions
    timeout-minutes: 15
    steps: *check-steps

  # check's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  check-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'typecheck · lint · test' || 'typecheck · lint · test (Seldon race off)' }}
    needs: [check]
    if: ${{ !cancelled() && needs.check.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions: *race-lane-permissions
    timeout-minutes: 15
    steps: *check-steps

  # The one check this workflow stands for, modelled on OxyHQ/Gemies': green
  # only when `check` passed, in whichever lane. Required checks by job name
  # cannot follow the Seldon race (a twin and a rescue share their job's name,
  # and a cancelled loser is not a failure); this one can.
  #
  # When the race or the rescue ran, `check` passes on the race's verdict: its
  # name passed in some lane and failed in no hosted lane. Otherwise `check` is
  # judged alone and its twin and rescue must have skipped.
  ci-complete:
    name: CI complete
    if: always()
    # Not race-finish: its reapers run on seldon-ci-light and only follow the
    # cancellation, so needing it would wait on Seldon.
    needs: [race, check, check-hosted, check-rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the Seldon race verdict reads this run's jobs
    steps:
      # Per job name: passed when one of its lanes succeeded and no hosted lane
      # failed. Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"; }

          # The race's start: skipped when not needed, never failed.
          case "$(result race)" in
            success | skipped) ;;
            *) failures+=("race did not pass: $(result race)") ;;
          esac

          own="$(result check)"
          twin="$(result check-hosted)"
          rescue="$(result check-rescue)"
          raced="$(jq -r '.race.outputs.race // ""' <<<"$RESULTS")"
          if [ "$rescue" != skipped ] || [ "$raced" = true ]; then
            check="${RACE_VERDICT:-no verdict}"
          else
            [ "$twin" = skipped ] || failures+=("check-hosted ran although the Seldon race did not: $twin")
            check="$own"
          fi
          [ "$check" = success ] || failures+=("typecheck · lint · test did not pass: $check")

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do echo "::error::$failure"; done
            exit 1
          fi
          echo 'Every job passed.'
