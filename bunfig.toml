[install]
# Bun's default "isolated" linker does NOT hoist, and this app cannot survive
# that. `@oxyhq/app-preset/css/base.css` reaches its `@source` globs by RELATIVE
# path — "../../services/lib", "../../bloom/lib" — which resolve only when
# app-preset, services and bloom are real siblings under ONE node_modules/@oxyhq/.
# Under the isolated linker those globs match nothing: Tailwind still emits a
# stylesheet, the SDK's and Bloom's class names are simply absent from it, and
# every className layout utility in @oxyhq/services' web screens is inert —
# react-native-web's base View reset shows through (flex-direction:column,
# padding:0) with no error anywhere. `createOxyMetroConfig`'s nodeModulesPaths
# ([projectRoot/node_modules, repoRoot/node_modules]) assumes the same layout.
linker = "hoisted"

# NOTE: `peer = false` is deliberately NOT set here, though OxyHQServices sets it
# at its root. In the monorepo three REQUIRED peers reach this app only because
# some OTHER workspace package declares them — expo-symbols (@oxyhq/bloom), and
# @react-native-community/netinfo + react-native-qrcode-svg (@oxyhq/services,
# neither in peerDependenciesMeta, so both are hard requirements). This repo has
# no other package. All three are now declared explicitly in
# packages/frontend/package.json as well; letting bun install peers is the belt
# to that braces.

# Supply-chain quarantine: refuse to RESOLVE anything published in the last week.
# Resolution-only, so an already-locked fresh package installs fine. A step that
# deliberately RE-RESOLVES (the CI lockfile-drift gate) must pass
# `--minimum-release-age=0` or it goes red on any recently-published dependency.
#
# The excludes are EXACT names, so every first-party package must be listed
# individually. OxyHQServices only had to exclude @oxyhq/bloom, because core,
# services, contracts and app-preset were `workspace:*` there and never touched
# the registry at all. Here they are ordinary registry dependencies, and the
# whole Oxy SDK ships faster than a 7-day window — measured 2026-08-10, every
# one of these was published within the preceding four days — so without them
# listed `bun install` refuses to resolve them outright. @oxyhq/protocol and
# @oxyhq/expo-splash are transitive but resolve the same way.
#
# The quarantine keeps doing its actual job: it guards against a freshly
# compromised THIRD-PARTY release. These are first-party.
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "@alia.onl/sdk",
  "@oxyhq/app-preset",
  "@oxyhq/bloom",
  "@oxyhq/contracts",
  "@oxyhq/core",
  "@oxyhq/expo-splash",
  "@oxyhq/protocol",
  "@oxyhq/services",
]

[test]
# The suite is JEST (see packages/frontend/jest.config.js). `bun test` — bun's
# own runner, one word away from `bun run test` — ignores that config entirely
# and half-runs the suite, reporting a plausible smaller number rather than an
# error. This preload aborts such a run. `bun run test` is unaffected: [test]
# applies only to `bun test`.
#
# bunfig resolves from cwd and bun never walks up, so the guard is declared BOTH
# here (for `bun test` at the repo root) and in packages/frontend/bunfig.toml.
preload = ["./packages/frontend/scripts/refuse-bun-test.ts"]
