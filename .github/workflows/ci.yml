name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # No build prelude. In OxyHQ/oxy this job first built @oxyhq/contracts,
      # protocol, core, services and expo-splash from workspace source; here all
      # five arrive prebuilt from npm. That is the whole simplification of the
      # split.
      - run: bun install

      # `--frozen-lockfile` is deliberately NOT used, here or in the deploy. On
      # bun 1.3.14 it exits 0 on both desync shapes that actually ship (a
      # workspace version bump, and a widened-but-satisfiable range) AND
      # false-positives on non-deterministic configVersion churn — a flag that
      # misses what it exists to catch and fails correct builds. This asks the
      # same question without bun's judgement in the middle.
      #
      # `--minimum-release-age=0`: this step RE-RESOLVES by design, and on a
      # cold manifest cache the bunfig quarantine judges every dependency
      # afresh, including already-locked ones.
      - name: bun.lock is in sync with the manifests
        run: |
          bun install --minimum-release-age=0
          git diff --exit-code bun.lock || {
            echo "::error::bun.lock does not match the package.json files. Run 'bun install' and commit bun.lock."
            exit 1
          }

      - run: bun run typecheck
      - run: bun run test

      # `bun test` must be REFUSED, not half-run. Asserted rather than assumed:
      # a preload that silently stopped loading would leave the suite reporting
      # a plausible smaller number under the wrong runner, which is the entire
      # hazard the guard exists for.
      #
      # The pattern is the guard's own sentence, NOT "bun test" — that substring
      # appears in bun's `bun test v1.3.x` banner, so grepping for it would pass
      # identically whether or not the guard ever loaded. Exit code alone is no
      # better: a half-run suite also exits non-zero.
      - name: '`bun test` is refused at both entry points'
        run: |
          # `set +e` is REQUIRED, not tidiness: GitHub runs this with
          # `bash -e {0}`, so the failing command substitution below aborts the
          # shell before `code=$?` is ever read — the step dies having printed
          # nothing at all, which is what it did on the first run.
          set +e
          set -uo pipefail
          for dir in . packages/frontend; do
            out=$(cd "$dir" && bun test 2>&1); code=$?
            echo "--- $dir → exit $code"
            if [ "$code" -eq 0 ]; then
              echo "::error::bun test succeeded in $dir; the refuse-bun-test preload is not wired."
              exit 1
            fi
            printf '%s' "$out" | grep -qF 'does not support `bun test`' || {
              echo "::error::bun test failed in $dir, but not via the guard — it half-ran the suite:"
              printf '%s' "$out" | head -10
              exit 1
            }
          done

  # Lint is a RATCHET, not a pass/fail gate — because it cannot be a pass/fail
  # gate today and a permanently-red check is worse than none: it teaches
  # everyone to ignore the X, and then it catches nothing when it goes redder.
  #
  # `expo lint` was already failing on OxyHQServices' main when this repo was
  # split out: measured 2026-08-10, 19 errors there against 21 here. The two
  # extra are not new code — a fresh lockfile resolves eslint-config-expo 57.0.1
  # where the monorepo's lock pinned 57.0.0, and it reclassifies four
  # `react-hooks/preserve-manual-memoization` findings as seven
  # `react-hooks/refs`. Inbox was never in the monorepo's lint CI at all, so
  # nothing has ever enforced this.
  #
  # So: green at or below the recorded count, red above it. That makes the job
  # honest today and still catches a regression tomorrow. Lower BASELINE as the
  # count comes down; at 0, delete this job and put `bun run lint` back in the
  # job above.
  lint:
    name: lint (ratchet)
    runs-on: ubuntu-latest
    env:
      BASELINE: 21
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: eslint error count must not exceed the baseline
        run: |
          set +e
          out=$(bun run lint 2>&1)
          printf '%s\n' "$out"
          # eslint's summary line: "✖ 37 problems (21 errors, 16 warnings)"
          errors=$(printf '%s' "$out" | grep -oE '[0-9]+ errors?' | tail -1 | grep -oE '[0-9]+')
          if [ -z "${errors:-}" ]; then
            # No summary line means eslint found NOTHING — or never ran. Those
            # look identical, so distinguish them rather than assuming zero.
            if printf '%s' "$out" | grep -qE 'Oops|Cannot find|ENOENT|error:'; then
              echo "::error::eslint did not run; treating as failure, not as zero errors."
              exit 1
            fi
            errors=0
          fi
          echo "eslint errors: $errors (baseline $BASELINE)"
          if [ "$errors" -gt "$BASELINE" ]; then
            echo "::error::eslint errors rose to $errors, above the $BASELINE baseline."
            exit 1
          fi
          if [ "$errors" -lt "$BASELINE" ]; then
            echo "::notice::eslint errors fell to $errors — lower BASELINE in ci.yml to lock it in."
          fi
