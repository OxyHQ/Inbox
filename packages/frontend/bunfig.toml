# inbox is a JEST package — see jest.config.js.
#
# `bun test` (bun's own runner) is NOT a supported way to run this suite: it
# ignores jest.config.js and half-runs the suite, reporting a plausible smaller
# number rather than an error. This preload aborts such a run with an
# explanation. `bun run test` — the declared script — is unaffected:
# [test].preload applies only to `bun test`.
#
# The repo-root bunfig.toml carries the same preload, pointing at this same
# file: bunfig resolves from cwd and bun never walks up, so `bun test` from the
# root would otherwise slip past this one. That is the gap OxyHQServices could
# not close, because its root bunfig serves packages that legitimately use
# bun's runner.
[test]
preload = ["./scripts/refuse-bun-test.ts"]
