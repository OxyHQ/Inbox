name: Deploy to Cloudflare

# Inbox is a frontend and nothing else. Mailboxes, federation, SMTP and webhook
# ingest are oxy-api, deployed from OxyHQ/oxy — so there is no backend here to
# build, no image to push and no ECS service to wait on. A web export and a
# Worker deploy is the whole of it.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialised, not cancelled: a cancelled deploy leaves the Worker on whichever
# build happened to land last, which is not necessarily the newest.
concurrency:
  group: deploy-inbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Not --frozen-lockfile — see the comment in ci.yml. Lockfile sync is
      # gated on the pull request.
      - run: bun install

      # tsc BEFORE the export: `expo export` bundles happily through a type
      # error, so without this a broken build ships as a green deploy.
      - run: bun run typecheck

      - run: bun run build
        env:
          EXPO_PUBLIC_API_URL: https://api.oxy.so
          EXPO_PUBLIC_OXY_AUTH_REDIRECT_URI: https://inbox.oxy.so
          # Inbox's PRODUCTION Oxy client id. `packages/frontend/constants/oxy.ts`
          # falls back to a committed id when this is unset, so nothing errors —
          # the deployed bundle just authenticates against the wrong Oxy
          # application. A repo VARIABLE rather than a secret: the id travels
          # inside the bundle, so it is public by construction, and hiding it
          # would only cost the ability to check what production uses.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.INBOX_OXY_CLIENT_ID }}

      # `typedRoutes` is inert as a CI gate: .expo/ is gitignored, nothing in CI
      # generates router.d.ts, and without it expo-router's `Href` degrades to
      # `string | HrefObject` — strictly MORE permissive. `expo export` writes
      # .expo/types as a side effect, so this second run is the only place a
      # route string is actually checked. ~30s.
      - name: typecheck again, now that expo export has written .expo/types
        run: bun run typecheck

      # The export must have produced the HTML, the security headers AND the
      # compiled Tailwind stylesheet. `expo export` exits 0 with an empty global
      # CSS when the @source globs resolve to nothing (see bunfig.toml), and
      # that failure is invisible until someone loads the page — colours still
      # work, because Bloom sets those inline, and only layout collapses.
      - name: The export is complete, not merely present
        run: |
          set -euo pipefail
          d=packages/frontend/dist
          test -f "$d/index.html"  || { echo "::error::no index.html"; exit 1; }
          test -f "$d/_headers"    || { echo "::error::no _headers — write-pages-headers did not run"; exit 1; }
          grep -q 'worker-src' "$d/_headers" || { echo "::error::_headers is missing this app's CSP extensions"; exit 1; }
          css=$(ls "$d"/_expo/static/css/global-*.css 2>/dev/null | head -1 || true)
          [ -n "${css:-}" ] || { echo "::error::no compiled global CSS — the Tailwind/@source pipeline produced nothing"; exit 1; }
          bytes=$(wc -c < "$css")
          echo "global css: $css ($bytes bytes)"
          [ "$bytes" -ge 20000 ] || { echo "::error::global CSS is only $bytes bytes; the SDK/Bloom @source globs matched nothing"; exit 1; }
          grep -q 'flex-row' "$css" || { echo "::error::global CSS carries no SDK layout utilities"; exit 1; }

      # THE POINT OF THE WORKER, asserted rather than assumed. Deleting
      # `workers_dev = false` is a one-line, entirely silent regression to the
      # defect this migration exists to remove: a second, complete copy of Inbox
      # on a hostname that is in no CORS allowlist and no `redirectUris` list.
      #
      # `not_found_handling` is here for the same reason. It is the ONLY thing
      # serving the shell for `/conversation/<id>`, `/label/<name>` and `/<view>`
      # now that `public/_redirects` is gone — measured locally against
      # `wrangler dev`, which parses that file and then reports its one rule
      # ("Infinite loop detected in this rule and has been ignored"). A Worker
      # does not honour it, so it cannot be the spare tyre it looks like.
      - name: The Worker declines its default hostname and keeps the SPA fallback
        run: |
          set -euo pipefail
          c=packages/frontend/wrangler.toml
          d=packages/frontend/dist
          grep -qE '^workers_dev[[:space:]]*=[[:space:]]*false' "$c" \
            || { echo "::error::$c does not set workers_dev = false — the deploy would publish a second copy of Inbox on a workers.dev hostname"; exit 1; }
          grep -qE '^not_found_handling[[:space:]]*=[[:space:]]*"single-page-application"' "$c" \
            || { echo "::error::$c has lost the SPA fallback that replaced public/_redirects — deep links would 404"; exit 1; }
          grep -qE '^pattern[[:space:]]*=[[:space:]]*"inbox\.oxy\.so"' "$c" \
            || { echo "::error::$c no longer claims inbox.oxy.so"; exit 1; }
          if [ -e "$d/_redirects" ]; then
            echo "::error::$d/_redirects is back. A Worker IGNORES it; not_found_handling is what serves the shell, and a file that looks like routing but is not will outlive whoever added it."
            exit 1
          fi
          echo "workers_dev=false · SPA fallback · inbox.oxy.so · no _redirects"

      # A WORKER, not a Pages project. A Pages project ALWAYS serves
      # `<project>.pages.dev` and Cloudflare offers no way to switch it off —
      # `wrangler pages project` has only `list`, `create` and `delete`. Alia
      # measured what that costs: `alia.onl` and `alia-app.pages.dev` served
      # byte-identical deployments, and the second, being in no CORS allowlist,
      # rendered the shell and failed every call it made. `oxy-inbox.pages.dev`
      # was the same second copy of THIS app. `workers_dev = false` in
      # packages/frontend/wrangler.toml leaves inbox.oxy.so as the only name
      # that reaches this deployment, and the assets directory, the SPA fallback
      # and the custom domain are declared in that file rather than passed here,
      # so a deploy cannot disagree with the config.
      #
      # `bunx wrangler@4` directly rather than cloudflare/wrangler-action, and
      # the migration did not change that: the action's `npx --no-install
      # wrangler` path runs npm's Arborist, which applies npm-only `overrides`
      # validation a bun-resolved tree has never been checked against (`npm
      # error code EOVERRIDE`). Same lesson as OxyHQ/oxy's deploy-auth job, and
      # the same one Alia's canvas job learned from five consecutive failed
      # runs — there the action picked npm because its `workingDirectory` had no
      # lockfile, which is exactly the shape `packages/frontend` has here.
      #
      # A Worker with no `main` is created by this deploy if it does not exist,
      # so there is no bootstrap step. The custom domain is claimed from
      # wrangler.toml — which is why the inbox.oxy.so DNS record Pages was using
      # must be deleted BEFORE the first run of this: a Worker custom domain
      # refuses a hostname that already has externally managed records
      # (code 100117).
      - name: Deploy the Worker
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy

      # Post-deploy gate on the LIVE host, public endpoints only. A blank SPA or
      # a stylesheet-less build turns this job red instead of sitting quietly in
      # production.
      - name: inbox.oxy.so is serving this build
        run: |
          # `set +e` because GitHub runs this with `bash -e {0}`: the retry loop
          # is built out of commands that are EXPECTED to fail while the edge
          # propagates, and errexit would kill the step on the first miss
          # instead of retrying — reporting a propagation delay as a broken
          # deploy.
          set +e
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "::group::smoke ${attempt}/5"
            html=$(curl -sS --max-time 20 https://inbox.oxy.so/ || true)
            csp=$(curl -sSI --max-time 20 https://inbox.oxy.so/ | tr -d '\r' | grep -i '^content-security-policy:' || true)
            if echo "$html" | grep -q 'Inbox by Oxy' \
               && echo "$html" | grep -q '_expo/static/css/global-' \
               && [ -n "$csp" ]; then
              echo "::endgroup::"; echo "OK"; exit 0
            fi
            echo "title: $(echo "$html" | grep -o '<title>[^<]*</title>' || echo MISSING)"
            echo "css:   $(echo "$html" | grep -o '_expo/static/css/global-[^\"]*' || echo MISSING)"
            echo "csp:   ${csp:-MISSING}"
            echo "::endgroup::"
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "::error::inbox.oxy.so is not serving a complete build"
          exit 1
