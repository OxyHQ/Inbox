name: Deploy to Cloudflare

# Inbox is a frontend and nothing else. Mailboxes, federation, SMTP and webhook
# ingest are oxy-api, deployed from OxyHQ/oxy — so there is no backend here to
# build, no image to push and no ECS service to wait on. A web export and a
# Worker deploy is the whole of it.

# It runs only AFTER CI has passed on a push to main, for the exact commit it
# releases (`workflow_run`). Until 2026-10 it ran on `push` beside CI, so a
# commit whose CI went red still reached production. `gate` below owns the
# guards and the scope a `push` trigger used to give for free.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A manual redeploy of main's head, and still only once CI has succeeded on a
  # push for it (`gate` checks that once and refuses otherwise).
  workflow_dispatch:

permissions:
  contents: read

env:
  # The commit under release: the head CI tested on `workflow_run`, main's head
  # on a dispatch. Never `github.sha` alone, which on `workflow_run` is whatever
  # main points at when the event is created.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Decides, OUTSIDE the release concurrency group, whether this run releases
  # anything. It must sit outside: GitHub cancels a PENDING run when another
  # queues behind it in the same group, so a run for an older commit (its CI
  # finished late) could displace a pending release of a newer one and then
  # hold itself, leaving neither deployed.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.newer.outputs.release == 'true' && steps.scope.outputs.release == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # Both decisions below walk history: to main's head, and from the
          # commit that is live, which can be any number of commits back.
          fetch-depth: 0
          persist-credentials: false

      # One-shot, not a poll: a dispatch is a manual redeploy of a commit CI
      # has already judged. `workflow_run` needs no such check; the guards
      # above already read CI's conclusion for this exact SHA.
      - name: Require a successful CI run on push for this commit (dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&event=push&branch=main&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has not succeeded on push to main for $DEPLOY_SHA; refusing to deploy it"
            exit 1
          fi
          echo "CI succeeded on push for $DEPLOY_SHA"

      # An older commit is held ONLY when a newer commit on main has a CI run of
      # its own (queued, in progress or succeeded): that commit's release will
      # carry this one. A newer commit with NO CI run, pushed with GITHUB_TOKEN
      # as a bot merge is (automerge-first-party.yml), starts no workflow at
      # all, so holding on "is this still main's head" alone would strand the
      # newest CI-tested commit behind it. Measured on OxyHQ/Alia, 2026-10-15.
      - name: Hold only for a newer main commit that CI is testing or passed
        id: newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release() { echo "release=$1" >>"$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          main=$(git rev-parse origin/main)
          if [ "$main" = "$DEPLOY_SHA" ]; then
            release true "$DEPLOY_SHA is main's head"
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" "$main"; then
            release false "::notice::$DEPLOY_SHA is no longer on main ($main); not releasing it"
          fi
          # Newest first. A run counts unless it finished without succeeding.
          for sha in $(git rev-list --first-parent "$DEPLOY_SHA..$main"); do
            live=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length')
            if [ "$live" -gt 0 ]; then
              release false "::notice::newer main commit $sha has its own CI run; its release carries $DEPLOY_SHA"
            fi
            echo "newer main commit $sha has no live or successful CI run; it does not hold $DEPLOY_SHA"
          done
          release true "no newer main commit is being released; releasing $DEPLOY_SHA"

      # `workflow_run` takes no `paths:`, and one push's own diff would miss
      # commits whose release was held or failed. So the scope is measured from
      # what inbox.oxy.so actually SERVES: every deploy publishes the commit it
      # was built from as /release.txt. An unknown path on this host answers
      # 200 with the SPA shell, so only a body that is exactly a 40-hex commit
      # counts as a marker.
      #
      #   * the live commit already contains this one (a re-run, or CI
      #     finishing out of order): hold, never roll production back;
      #   * everything changed since the live commit cannot reach the bundle
      #     (Markdown, docs/, CI-only workflow and bot config): hold;
      #   * anything else, or anything this cannot establish (no marker, a live
      #     commit that is not an ancestor, a failed fetch): release.
      #
      # A dispatch always releases: it is the manual redeploy.
      - name: Decide whether this commit changes what inbox.oxy.so serves
        id: scope
        if: steps.newer.outputs.release == 'true'
        run: |
          set -uo pipefail
          decide() { echo "release=$1" >>"$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            decide true "manual dispatch: releasing $DEPLOY_SHA"
          fi
          live=$(curl -fsS --max-time 20 "https://inbox.oxy.so/release.txt?scope=${DEPLOY_SHA}" | tr -d '[:space:]') || live=
          [[ "$live" =~ ^[0-9a-f]{40}$ ]] || decide true "no release marker is live; releasing"
          git cat-file -e "$live^{commit}" 2>/dev/null || decide true "live commit $live is not in this history; releasing"
          if git merge-base --is-ancestor "$DEPLOY_SHA" "$live"; then
            decide false "::notice::live commit $live already contains $DEPLOY_SHA; nothing to release"
          fi
          git merge-base --is-ancestor "$live" "$DEPLOY_SHA" || decide true "live commit $live is not an ancestor of $DEPLOY_SHA; releasing"
          changed=$(git diff --name-only "$live" "$DEPLOY_SHA") || decide true "could not diff $live..$DEPLOY_SHA; releasing"
          relevant=$(grep -vE '\.md$|^docs/|^\.github/dependabot\.yml$|^\.github/workflows/(ci|automerge-first-party)\.yml$|^\.mailmap$' <<<"$changed" || true)
          if [ -z "$relevant" ]; then
            decide false "::notice::nothing that reaches the bundle changed since live $live; not releasing"
          fi
          echo "changed since live $live:"
          printf '  %s\n' $relevant
          decide true "releasing $DEPLOY_SHA"

  deploy:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: production
    # A good run takes 3-4 minutes, most of it the install and the export.
    timeout-minutes: 30
    permissions:
      contents: read
    # Serialised, not cancelled: a cancelled deploy leaves the Worker on
    # whichever build happened to land last, which is not necessarily the
    # newest. On the JOB, not the workflow, so only a run `gate` judged
    # releasable ever enters the group. A newer pending run replacing an older
    # pending one is safe: it releases everything since what is live.
    concurrency:
      group: deploy-inbox
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Expo SDK 58's CLI supports Node 22.13+ / 24.3+ only (`expo export`
      # here, `expo lint` in CI). Pinned rather than trusting the runner
      # image's default Node.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Lockfile sync is CI's job, and CI has already passed on this exact
      # commit (`gate`): its install is --frozen-lockfile, and it re-resolves
      # and diffs bun.lock as well.
      - run: bun install

      # tsc BEFORE the export: `expo export` bundles happily through a type
      # error, so without this a broken build ships as a green deploy.
      - run: bun run typecheck

      - run: bun run build
        env:
          EXPO_PUBLIC_API_URL: https://api.oxy.so
          EXPO_PUBLIC_ALIA_API_URL: https://api.alia.onl
          EXPO_PUBLIC_OXY_AUTH_REDIRECT_URI: https://inbox.oxy.so
          # Inbox's PRODUCTION Oxy client id. `packages/frontend/constants/oxy.ts`
          # falls back to a committed id when this is unset, so nothing errors —
          # the deployed bundle just authenticates against the wrong Oxy
          # application. A repo VARIABLE rather than a secret: the id travels
          # inside the bundle, so it is public by construction, and hiding it
          # would only cost the ability to check what production uses.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.INBOX_OXY_CLIENT_ID }}

      # `typedRoutes` is inert as a CI gate: .expo/ is gitignored, nothing in CI
      # generates router.d.ts, and without it expo-router's `Href` degrades to
      # `string | HrefObject` — strictly MORE permissive. `expo export` writes
      # .expo/types as a side effect, so this second run is the only place a
      # route string is actually checked. ~30s.
      - name: typecheck again, now that expo export has written .expo/types
        run: bun run typecheck

      # The export must have produced the HTML, the security headers AND the
      # compiled Tailwind stylesheet. `expo export` exits 0 with an empty global
      # CSS when the @source globs resolve to nothing (see bunfig.toml), and
      # that failure is invisible until someone loads the page — colours still
      # work, because Bloom sets those inline, and only layout collapses.
      - name: The export is complete, not merely present
        run: |
          set -euo pipefail
          d=packages/frontend/dist
          test -f "$d/index.html"  || { echo "::error::no index.html"; exit 1; }
          test -f "$d/_headers"    || { echo "::error::no _headers — write-pages-headers did not run"; exit 1; }
          grep -q 'worker-src' "$d/_headers" || { echo "::error::_headers is missing this app's CSP extensions"; exit 1; }
          grep -qF 'https://api.alia.onl' "$d/_headers" || { echo "::error::_headers does not allow the canonical Alia API"; exit 1; }
          grep -qF 'wss://api.alia.onl' "$d/_headers" || { echo "::error::_headers does not allow Alia realtime sessions"; exit 1; }
          css=$(ls "$d"/_expo/static/css/global-*.css 2>/dev/null | head -1 || true)
          [ -n "${css:-}" ] || { echo "::error::no compiled global CSS — the Tailwind/@source pipeline produced nothing"; exit 1; }
          bytes=$(wc -c < "$css")
          echo "global css: $css ($bytes bytes)"
          [ "$bytes" -ge 20000 ] || { echo "::error::global CSS is only $bytes bytes; the SDK/Bloom @source globs matched nothing"; exit 1; }
          grep -q 'flex-row' "$css" || { echo "::error::global CSS carries no SDK layout utilities"; exit 1; }
          # The HTML must LOAD the bundle and the stylesheet. On Expo SDK 58 a
          # custom app/+html.tsx that does not render useServerDocumentContext()'s
          # headNodes/bodyNodes exports every page without them: exit 0, every
          # file present, and a site that shows its server-rendered spinner
          # forever (2026-10-19, #113). Checked on every exported page, and by
          # bundle LOCATION, not name: Metro's chunk names (entry-*,
          # __expo-metro-runtime-*, index-*) depend on the router's split.
          while IFS= read -r -d '' page; do
            scripts=$(grep -oE '<script[^>]* src="/_expo/static/js/web/[^"]+\.js"' "$page" | grep -oE '/_expo/static/js/web/[^"]+\.js' || true)
            [ -n "$scripts" ] || { echo "::error::$page loads no bundle from /_expo/static/js/web/"; exit 1; }
            for js in $scripts; do
              test -f "$d$js" || { echo "::error::$page loads $js, which the export does not contain"; exit 1; }
            done
            grep -qE '<link rel="stylesheet" href="/_expo/static/css/global-[^"]+\.css"' "$page" \
              || { echo "::error::$page does not link the global stylesheet"; exit 1; }
          done < <(find "$d" -name '*.html' -print0)
          echo "every exported page loads its bundle and the global stylesheet"

      # THE POINT OF THE WORKER, asserted rather than assumed. Deleting
      # `workers_dev = false` is a one-line, entirely silent regression to the
      # defect this migration exists to remove: a second, complete copy of Inbox
      # on a hostname that is in no CORS allowlist and no `redirectUris` list.
      #
      # `not_found_handling` is here for the same reason. It is the ONLY thing
      # serving the shell for `/conversation/<id>`, `/label/<name>` and `/<view>`
      # now that `public/_redirects` is gone — measured locally against
      # `wrangler dev`, which parses that file and then reports its one rule
      # ("Infinite loop detected in this rule and has been ignored"). A Worker
      # does not honour it, so it cannot be the spare tyre it looks like.
      - name: The Worker declines its default hostname and keeps the SPA fallback
        run: |
          set -euo pipefail
          c=packages/frontend/wrangler.toml
          d=packages/frontend/dist
          grep -qE '^workers_dev[[:space:]]*=[[:space:]]*false' "$c" \
            || { echo "::error::$c does not set workers_dev = false — the deploy would publish a second copy of Inbox on a workers.dev hostname"; exit 1; }
          grep -qE '^not_found_handling[[:space:]]*=[[:space:]]*"single-page-application"' "$c" \
            || { echo "::error::$c has lost the SPA fallback that replaced public/_redirects — deep links would 404"; exit 1; }
          grep -qE '^pattern[[:space:]]*=[[:space:]]*"inbox\.oxy\.so"' "$c" \
            || { echo "::error::$c no longer claims inbox.oxy.so"; exit 1; }
          if [ -e "$d/_redirects" ]; then
            echo "::error::$d/_redirects is back. A Worker IGNORES it; not_found_handling is what serves the shell, and a file that looks like routing but is not will outlive whoever added it."
            exit 1
          fi
          echo "workers_dev=false · SPA fallback · inbox.oxy.so · no _redirects"

      # A WORKER, not a Pages project. A Pages project ALWAYS serves
      # `<project>.pages.dev` and Cloudflare offers no way to switch it off —
      # `wrangler pages project` has only `list`, `create` and `delete`. Alia
      # measured what that costs: `alia.onl` and `alia-app.pages.dev` served
      # byte-identical deployments, and the second, being in no CORS allowlist,
      # rendered the shell and failed every call it made. `oxy-inbox.pages.dev`
      # was the same second copy of THIS app. `workers_dev = false` in
      # packages/frontend/wrangler.toml leaves inbox.oxy.so as the only name
      # that reaches this deployment, and the assets directory, the SPA fallback
      # and the custom domain are declared in that file rather than passed here,
      # so a deploy cannot disagree with the config.
      #
      # `bunx wrangler` DIRECTLY, never `cloudflare/wrangler-action`, and the
      # migration did not change that. The action installs its own wrangler and
      # picks the package manager by looking for a lockfile beside
      # `workingDirectory` — there is none in `packages/frontend`, the lockfile
      # is at the repository root — so it falls back to npm. Here that is npm's
      # Arborist applying npm-only `overrides` validation a bun-resolved tree
      # has never been checked against (`npm error code EOVERRIDE`), the same
      # lesson as OxyHQ/oxy's deploy-auth job. Elsewhere in the fleet the same
      # fallback has cost more: Homiio took a production outage from it on
      # 2026-08-09 (run 31292337344: `Fail extracting tarball for "wrangler"`,
      # published nothing, left a stale bundle against a changed API) and moved
      # off the action in #291; Mercaria's AGENTS.md:196 forbids it outright;
      # Alia's canvas job failed five consecutive runs on it; Clarity's frontend
      # deploy hit the identical error. Do not "modernise" this back.
      #
      # `wrangler@4` is PINNED: an unpinned `bunx wrangler` re-resolves the
      # latest major on every deploy, changing the deploy path with no diff.
      #
      # A Worker with no `main` is created by this deploy if it does not exist,
      # so there is no bootstrap step. The custom domain is claimed from
      # wrangler.toml — which is why the inbox.oxy.so DNS record Pages was using
      # must be deleted BEFORE the first run of this: a Worker custom domain
      # refuses a hostname that already has externally managed records
      # (code 100117).
      #
      # /release.txt names the commit this bundle was built from. `gate` diffs
      # from it to decide the next release, and the smoke below reads it back.
      - name: Deploy the Worker
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s\n' "$DEPLOY_SHA" > dist/release.txt
          bunx wrangler@4 deploy

      # Post-deploy gate on the LIVE host, public endpoints only. A blank SPA or
      # a stylesheet-less build turns this job red instead of sitting quietly in
      # production.
      - name: inbox.oxy.so is serving this build
        run: |
          set +e
          set -uo pipefail
          # The app's own bundle is the LAST script the page loads (runtime and
          # shared chunks come first); its hashed name changes with every build.
          expected_entry=$(grep -oE '_expo/static/js/web/[^"]+\.js' packages/frontend/dist/index.html | tail -1)
          [ -n "$expected_entry" ] || { echo "::error::built index has no entry bundle"; exit 1; }
          for attempt in {1..12}; do
            echo "::group::smoke ${attempt}/12"
            html=$(curl -sS --max-time 20 "https://inbox.oxy.so/?build=${DEPLOY_SHA}" || true)
            release=$(curl -sS --max-time 20 "https://inbox.oxy.so/release.txt?build=${DEPLOY_SHA}" | tr -d '[:space:]' || true)
            csp=$(curl -sSI --max-time 20 https://inbox.oxy.so/ | tr -d '\r' | grep -i '^content-security-policy:' || true)
            # A complete SSR document exceeds a pipe buffer. With pipefail,
            # grep -q can close that pipe early and make echo fail with SIGPIPE
            # even when the expected text is present. Give grep the input itself.
            if [ "$release" = "$DEPLOY_SHA" ] \
               && grep -q 'Inbox by Oxy' <<< "$html" \
               && grep -qF "$expected_entry" <<< "$html" \
               && grep -qF 'https://api.alia.onl' <<< "$csp" \
               && grep -qF 'wss://api.alia.onl' <<< "$csp"; then
              echo "::endgroup::"; echo "OK: $expected_entry · release $release"; exit 0
            fi
            echo "expected: $expected_entry · release $DEPLOY_SHA"
            echo "release: ${release:0:40}"
            echo "title: $(echo "$html" | grep -o '<title>[^<]*</title>' || echo MISSING)"
            echo "entry: $(echo "$html" | grep -oE '_expo/static/js/web/[^\"]+\.js' | tail -1 || echo MISSING)"
            echo "csp:   ${csp:-MISSING}"
            echo "::endgroup::"
            [ "$attempt" -lt 12 ] && sleep 10
          done
          echo "::error::inbox.oxy.so is not serving the bundle built by this run"
          exit 1
